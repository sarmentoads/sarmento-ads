<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarmento Ads — CRM de Oportunidades</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              caribe: '#00C46A',
              forest: '#1E4A37',
              dark: '#080808',
              surface: '#0f0f0f',
              card: 'rgba(18, 18, 18, 0.85)',
              border: 'rgba(255, 255, 255, 0.08)',
              muted: '#8A8A8A',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #060606;
      color: #ECECEC;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- BARRA DE NAVEGAÇÃO DO CRM -->
  <nav class="border-b border-white/[0.08] bg-[#0A0A0A]/90 sticky top-0 z-50 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="w-2.5 h-2.5 rounded-full bg-brand-caribe shadow-[0_0_10px_#00C46A]"></span>
        <span class="text-sm font-semibold tracking-wider text-white">SARMENTO <span class="font-mono text-brand-caribe text-xs">CRM</span></span>
        <span class="text-xs font-mono px-2 py-0.5 rounded bg-white/5 border border-white/10 text-brand-muted ml-2">Pipeline V1.0</span>
      </div>

      <div class="flex items-center gap-4">
        <button onclick="carregarLeads()" class="flex items-center gap-2 text-xs font-mono px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition">
          <svg class="w-3.5 h-3.5 text-brand-caribe" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Atualizar Leads
        </button>
        <a href="/" class="text-xs font-mono text-brand-muted hover:text-white transition">Ver Site ↗</a>
      </div>
    </div>
  </nav>

  <!-- DASHBOARD PRINCIPAL -->
  <main class="max-w-7xl mx-auto px-6 pt-8">
    
    <!-- CARDS DE MÉTRICAS RÁPIDAS -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-8">
      <div class="p-5 rounded-2xl bg-[#0F0F0F] border border-white/[0.06]">
        <div class="text-[11px] font-mono text-brand-muted uppercase">Total de Oportunidades</div>
        <div id="stat-total" class="text-2xl font-bold font-mono text-white mt-1">0</div>
      </div>
      <div class="p-5 rounded-2xl bg-[#0F0F0F] border border-white/[0.06]">
        <div class="text-[11px] font-mono text-brand-caribe uppercase">Novos Leads</div>
        <div id="stat-novos" class="text-2xl font-bold font-mono text-brand-caribe mt-1">0</div>
      </div>
      <div class="p-5 rounded-2xl bg-[#0F0F0F] border border-white/[0.06]">
        <div class="text-[11px] font-mono text-amber-400 uppercase">Diagnóstico Agendado</div>
        <div id="stat-agendados" class="text-2xl font-bold font-mono text-amber-400 mt-1">0</div>
      </div>
      <div class="p-5 rounded-2xl bg-[#0F0F0F] border border-white/[0.06]">
        <div class="text-[11px] font-mono text-emerald-400 uppercase">Contratos Fechados</div>
        <div id="stat-fechados" class="text-2xl font-bold font-mono text-emerald-400 mt-1">0</div>
      </div>
    </div>

    <!-- PIPELINE VISUAL (KANBAN COLUMNS) -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-start">
      
      <!-- Coluna 1: Novos -->
      <div class="rounded-2xl bg-[#0c0c0c] border border-white/[0.06] p-4">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/[0.06]">
          <span class="text-xs font-mono font-semibold text-white flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-brand-caribe"></span> NOVOS
          </span>
          <span id="badge-novos" class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-white/5 text-brand-muted">0</span>
        </div>
        <div id="coluna-novo" class="space-y-3 min-h-[300px]"></div>
      </div>

      <!-- Coluna 2: Em Contato -->
      <div class="rounded-2xl bg-[#0c0c0c] border border-white/[0.06] p-4">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/[0.06]">
          <span class="text-xs font-mono font-semibold text-white flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-blue-400"></span> EM CONTATO
          </span>
          <span id="badge-contato" class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-white/5 text-brand-muted">0</span>
        </div>
        <div id="coluna-em_contato" class="space-y-3 min-h-[300px]"></div>
      </div>

      <!-- Coluna 3: Diagnóstico Agendado -->
      <div class="rounded-2xl bg-[#0c0c0c] border border-white/[0.06] p-4">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/[0.06]">
          <span class="text-xs font-mono font-semibold text-white flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span> DIAGNÓSTICO
          </span>
          <span id="badge-agendado" class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-white/5 text-brand-muted">0</span>
        </div>
        <div id="coluna-diagnostico_agendado" class="space-y-3 min-h-[300px]"></div>
      </div>

      <!-- Coluna 4: Fechados -->
      <div class="rounded-2xl bg-[#0c0c0c] border border-white/[0.06] p-4">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/[0.06]">
          <span class="text-xs font-mono font-semibold text-white flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span> FECHADOS
          </span>
          <span id="badge-fechado" class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-white/5 text-brand-muted">0</span>
        </div>
        <div id="coluna-fechado" class="space-y-3 min-h-[300px]"></div>
      </div>

    </div>

  </main>

  <script>
    const SUPABASE_URL = "https://yqiunyrpkljtgenjeyev.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6YnqMemgF07N1YwoTxVCkg_utecUki8";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function carregarLeads() {
      const { data: leads, error } = await client
        .from('leads')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Erro ao carregar:", error);
        return;
      }

      // Limpar colunas
      document.getElementById('coluna-novo').innerHTML = '';
      document.getElementById('coluna-em_contato').innerHTML = '';
      document.getElementById('coluna-diagnostico_agendado').innerHTML = '';
      document.getElementById('coluna-fechado').innerHTML = '';

      let stats = { total: leads.length, novo: 0, diagnostico_agendado: 0, fechado: 0, em_contato: 0 };

      leads.forEach(lead => {
        const col = document.getElementById(`coluna-${lead.status}`) || document.getElementById('coluna-novo');
        if (stats.hasOwnProperty(lead.status)) stats[lead.status]++;

        const card = document.createElement('div');
        card.className = "p-4 rounded-xl bg-[#141414] border border-white/[0.08] hover:border-brand-caribe/40 transition flex flex-col gap-3";
        
        // Formatar número limpo para WhatsApp
        const zapLimpo = lead.whatsapp.replace(/\D/g, '');
        const dataFormatada = new Date(lead.created_at).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div>
              <div class="text-sm font-semibold text-white">${lead.nome}</div>
              <div class="text-[10px] font-mono text-brand-muted mt-0.5">${dataFormatada}</div>
            </div>
            <a href="https://wa.me/55${zapLimpo}?text=Olá%20${encodeURIComponent(lead.nome)},%20sou%20da%20Sarmento%20Ads.%20Recebi%20seu%20contato." 
               target="_blank" 
               class="px-2.5 py-1 rounded bg-brand-forest/40 hover:bg-brand-forest text-brand-caribe text-[10px] font-mono border border-brand-forest/60 transition">
              WhatsApp ↗
            </a>
          </div>

          <div class="text-xs text-gray-300 font-mono space-y-1 bg-black/40 p-2.5 rounded-lg border border-white/[0.04]">
            <div class="text-[11px] truncate"><span class="text-brand-muted">Email:</span> ${lead.email || 'Não informado'}</div>
            <div class="text-[11px]"><span class="text-brand-muted">Nicho:</span> ${lead.nicho || 'Não informado'}</div>
            <div class="text-[11px]"><span class="text-brand-muted">Faturamento:</span> <span class="text-brand-caribe font-medium">${lead.faturamento || '—'}</span></div>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-white/[0.05]">
            <select onchange="atualizarStatus('${lead.id}', this.value)" class="text-[11px] font-mono bg-black/60 border border-white/10 rounded px-2 py-1 text-white focus:outline-none focus:border-brand-caribe">
              <option value="novo" ${lead.status === 'novo' ? 'selected' : ''}>Novo</option>
              <option value="em_contato" ${lead.status === 'em_contato' ? 'selected' : ''}>Em Contato</option>
              <option value="diagnostico_agendado" ${lead.status === 'diagnostico_agendado' ? 'selected' : ''}>Diagnóstico</option>
              <option value="fechado" ${lead.status === 'fechado' ? 'selected' : ''}>Fechado</option>
              <option value="perdido" ${lead.status === 'perdido' ? 'selected' : ''}>Perdido</option>
            </select>

            <button onclick="excluirLead('${lead.id}')" class="text-neutral-500 hover:text-red-400 text-xs px-2 py-1 transition" title="Excluir">✕</button>
          </div>
        `;

        col.appendChild(card);
      });

      // Atualizar badges e cards de métricas
      document.getElementById('stat-total').innerText = stats.total;
      document.getElementById('stat-novos').innerText = stats.novo;
      document.getElementById('stat-agendados').innerText = stats.diagnostico_agendado;
      document.getElementById('stat-fechados').innerText = stats.fechado;

      document.getElementById('badge-novos').innerText = stats.novo;
      document.getElementById('badge-contato').innerText = stats.em_contato;
      document.getElementById('badge-agendado').innerText = stats.diagnostico_agendado;
      document.getElementById('badge-fechado').innerText = stats.fechado;
    }

    async function atualizarStatus(id, novoStatus) {
      await client.from('leads').update({ status: novoStatus }).eq('id', id);
      carregarLeads();
    }

    async function excluirLead(id) {
      if (confirm("Deseja realmente remover esta oportunidade?")) {
        await client.from('leads').delete().eq('id', id);
        carregarLeads();
      }
    }

    // Carregamento inicial automático
    carregarLeads();
  </script>
</body>
</html>
